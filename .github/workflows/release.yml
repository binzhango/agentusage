name: Automatic Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      release_commit:
        description: Existing release commit SHA for the GitHub source release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  version:
    name: Prepare release source
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Check out Rust project only
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          sparse-checkout: |
            .github
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
            LICENSE
            Makefile
            README.md
            docs
            src
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Bump minor version
        if: github.event_name == 'push'
        run: |
          cargo install cargo-edit --locked
          cargo set-version --bump minor

      - name: Verify release source
        if: github.event_name == 'push'
        run: |
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo package --locked --allow-dirty --no-verify

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Update changelog
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import pathlib

          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text() if path.exists() else "# Changelog\n\n## [Unreleased]\n"
          marker = "## [Unreleased]"
          placeholder = "Changes that have not been released yet."
          if marker not in text:
              raise SystemExit("CHANGELOG.md is missing an Unreleased section")
          section_start = text.index(marker) + len(marker)
          next_section = text.find("\n## [", section_start)
          section_end = len(text) if next_section == -1 else next_section
          unreleased = text[section_start:section_end].strip()
          if unreleased.startswith(placeholder):
              unreleased = unreleased[len(placeholder):].strip()
          details = unreleased or "- Maintenance release"
          section = (
              f"## [{os.environ['VERSION']}] - "
              f"{datetime.date.today().isoformat()}\n\n{details}\n\n"
          )
          prefix = text[:section_start]
          suffix = text[section_end:].lstrip()
          text = (
              f"{prefix}\n\n{placeholder}\n\n{section}"
              f"{suffix}"
          )
          path.write_text(text)
          PY

      - name: Commit version and tag
        if: github.event_name == 'push'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"

      - name: Check existing release commit
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor HEAD origin/main
          test "$(git log -1 --format=%s)" = "chore(release): v${VERSION} [skip ci]"
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            test "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$RELEASE_COMMIT"
          fi

      - name: Capture release revision
        id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish crate
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  github-release:
    name: Publish GitHub release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out released changelog
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.revision }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Read release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text()
          _, heading, rest = text.partition(f"\n## [{version}] - ")
          if not heading:
              raise SystemExit(f"CHANGELOG.md has no release entry for {version}")
          _, _, body = rest.partition("\n")
          notes = body.split("\n## [", 1)[0].strip()
          Path("RELEASE_NOTES.md").write_text(f"# agentusage {version}\n\n{notes}\n")
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.revision }}
          body_path: RELEASE_NOTES.md
