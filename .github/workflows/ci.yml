name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out Rust project only
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
            LICENSE
            Makefile
            README.md
            docs
            src

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check package boundary
        run: cargo package --locked --allow-dirty

  postgres-parity:
    name: PostgreSQL parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentusage
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentusage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTUSAGE_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/agentusage

    steps:
      - name: Check out Rust project only
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            src

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-postgres-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-postgres-cargo-

      - name: Run backend parity tests
        run: cargo test --locked sqlite_and_postgres_return_equivalent_usage_views
